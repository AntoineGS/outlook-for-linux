name: Flatpak Smoke Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    runs-on: ubuntu-latest
    steps:
      - name: Report unavailable packaging target
        run: |
          echo "::notice::Flatpak smoke testing is disabled until an Outlook for Linux packaging repository exists."
          {
            echo "## Flatpak smoke unavailable"
            echo
            echo "Outlook for Linux does not yet have a Flatpak packaging repository."
          } >> "$GITHUB_STEP_SUMMARY"
