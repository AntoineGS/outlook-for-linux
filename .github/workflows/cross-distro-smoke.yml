name: Cross-Distro Smoke Test

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: outlook-for-linux-linux-x64
      run_id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run containing the x64 artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name"
        required: false
        default: outlook-for-linux-linux-x64
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, debian]
        display: [x11, wayland, xwayland]
    name: smoke (${{ matrix.distro }}, ${{ matrix.display }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download same-run x64 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'outlook-for-linux-linux-x64' }}
        run: |
          set -euo pipefail
          rm -rf tests/cross-distro/app
          mkdir -p tests/cross-distro/app
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir tests/cross-distro/app
          mapfile -t appimages < <(find tests/cross-distro/app -maxdepth 1 -type f -name '*.AppImage')
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one x64 AppImage, found ${#appimages[@]}"
            exit 1
          fi
          mv "${appimages[0]}" tests/cross-distro/app/teams-for-linux.AppImage
          chmod +x tests/cross-distro/app/teams-for-linux.AppImage

      - name: Build Docker image
        env:
          DISTRO: ${{ matrix.distro }}
          # The Dockerfiles use ADD --checksum, which requires BuildKit
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            -t "cross-distro-${DISTRO}" \
            -f "tests/cross-distro/dockerfiles/${DISTRO}.Dockerfile" \
            tests/cross-distro/

      - name: Start container
        env:
          DISTRO: ${{ matrix.distro }}
          DISPLAY_SERVER: ${{ matrix.display }}
        run: |
          docker run -d \
            --name "smoke-${DISTRO}-${DISPLAY_SERVER}" \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --cap-add SYS_ADMIN \
            --cap-add SYS_NICE \
            --shm-size 4g \
            --platform linux/amd64 \
            -e "DISPLAY_SERVER=${DISPLAY_SERVER}" \
            -e AUTO_LAUNCH=true \
            -e SCREEN_RESOLUTION=1920x1080x24 \
            -v "$GITHUB_WORKSPACE/tests/cross-distro/app:/app:ro" \
            "cross-distro-${DISTRO}"

      - name: Run smoke check
        env:
          DISTRO: ${{ matrix.distro }}
          DISPLAY_SERVER: ${{ matrix.display }}
        run: |
          tests/cross-distro/scripts/smoke-check.sh \
            "smoke-${DISTRO}-${DISPLAY_SERVER}" 120

      - name: Write job summary
        if: always()
        env:
          DISTRO: ${{ matrix.distro }}
          DISPLAY_SERVER: ${{ matrix.display }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="pass"
          else
            ICON="FAIL"
          fi
          echo "| ${DISTRO} | ${DISPLAY_SERVER} | ${ICON} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs on failure
        if: failure()
        env:
          CONTAINER: smoke-${{ matrix.distro }}-${{ matrix.display }}
        run: |
          mkdir -p /tmp/smoke-logs
          docker logs "${CONTAINER}" \
            > /tmp/smoke-logs/container.log 2>&1 || true
          docker exec "${CONTAINER}" \
            cat /tmp/app.log > /tmp/smoke-logs/app.log 2>/dev/null || true

      - name: Upload log artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs-${{ matrix.distro }}-${{ matrix.display }}
          path: /tmp/smoke-logs/
          retention-days: 7

      - name: Cleanup container
        if: always()
        env:
          CONTAINER: smoke-${{ matrix.distro }}-${{ matrix.display }}
        run: |
          docker rm -f "${CONTAINER}" 2>/dev/null || true
